name: Update release notes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.5.12)
        required: true
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the release text with RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
