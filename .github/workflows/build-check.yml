name: Build check

# Compiles the app on every push (no secrets needed) so errors show up before a release.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Placeholder google-services.json (real one is only used for releases)
        run: |
          if [ ! -f app/google-services.json ]; then
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "olive-ci", "storage_bucket": "olive-ci.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.waleve.player"}},
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDUMMY-KEY-FOR-CI-BUILDS-000000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
          fi
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
