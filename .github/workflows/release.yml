name: Build & Release APK

# Runs when you push a tag like v1.1.0, or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Add the GOOGLE_SERVICES_JSON secret"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OLIVE_KEYSTORE_BASE64 }}
          OLIVE_KEYSTORE_PASSWORD: ${{ secrets.OLIVE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # tolerate line breaks / spaces / quotes that sneak in when copying from PowerShell
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"' > "$RUNNER_TEMP/ks.b64"
            echo "keystore base64 length: $(wc -c < "$RUNNER_TEMP/ks.b64")"
            if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/olive.jks" 2>/dev/null; then
              echo "::error::OLIVE_KEYSTORE_BASE64 is not valid base64. Re-copy it with the PowerShell command (it should be one long line of letters/numbers ending in = or letters)."
              exit 1
            fi
            echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/olive.jks")"
            keytool -list -v -keystore "$RUNNER_TEMP/olive.jks" -storepass "$OLIVE_KEYSTORE_PASSWORD" 2>/dev/null | grep -E "Alias name|SHA1" || echo "::warning::could not read keystore with the given password"
            echo "OLIVE_KEYSTORE_PATH=$RUNNER_TEMP/olive.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No OLIVE_KEYSTORE_BASE64 secret — APK will be debug-signed"
          fi

      - name: Build release APK
        env:
          OLIVE_KEYSTORE_PASSWORD: ${{ secrets.OLIVE_KEYSTORE_PASSWORD }}
          OLIVE_KEY_ALIAS: ${{ secrets.OLIVE_KEY_ALIAS }}
          OLIVE_KEY_PASSWORD: ${{ secrets.OLIVE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Find APKs
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name 'Olive.apk' | head -1)
          APK32=$(find app/build/outputs/apk/release -name 'Olive-32bit.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "path32=$APK32" >> "$GITHUB_OUTPUT"
          ls -la "$APK" "$APK32"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Olive ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: 'true'
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}

      # Uploaded second so Olive.apk stays the first asset (older in-app updaters take the first one)
      - name: Add 32-bit APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path32 }}
