name: Build & Release APK

# Runs when you push a tag like v1.1.0, or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Add the GOOGLE_SERVICES_JSON secret"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OLIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/olive.jks"
            echo "OLIVE_KEYSTORE_PATH=$RUNNER_TEMP/olive.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No OLIVE_KEYSTORE_BASE64 secret — APK will be debug-signed"
          fi

      - name: Build release APK
        env:
          OLIVE_KEYSTORE_PASSWORD: ${{ secrets.OLIVE_KEYSTORE_PASSWORD }}
          OLIVE_KEY_ALIAS: ${{ secrets.OLIVE_KEY_ALIAS }}
          OLIVE_KEY_PASSWORD: ${{ secrets.OLIVE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Olive ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: 'true'
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
