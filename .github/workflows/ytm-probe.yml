name: ytm-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sL https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o yt-dlp && chmod +x yt-dlp
          ./yt-dlp --version
          V=Zi_XLOBDo_Y
          echo "=== A default (no JS runtime)"; ./yt-dlp --no-js-runtimes -f bestaudio --get-url "https://music.youtube.com/watch?v=$V" 2>&1 | cut -c1-160 | tail -6
          echo "=== B android_vr"; ./yt-dlp --no-js-runtimes --extractor-args "youtube:player_client=android_vr" -f bestaudio --get-url "https://music.youtube.com/watch?v=$V" 2>&1 | cut -c1-160 | tail -4
          echo "=== C tv,android_vr"; ./yt-dlp --no-js-runtimes --extractor-args "youtube:player_client=tv,android_vr" -f bestaudio --get-url "https://music.youtube.com/watch?v=$V" 2>&1 | cut -c1-160 | tail -4
          cat > p.py <<'PY'
          import json, urllib.request
          def player(client, ver, ua, extra):
              ctx={"client":dict(clientName=client, clientVersion=ver, hl="en", gl="US", **extra)}
              b=json.dumps({"context":ctx,"videoId":"Zi_XLOBDo_Y","contentCheckOk":True,"racyCheckOk":True}).encode()
              r=urllib.request.Request("https://www.youtube.com/youtubei/v1/player?prettyPrint=false", data=b, headers={"Content-Type":"application/json","User-Agent":ua,"X-YouTube-Client-Name":"28" if client=="ANDROID_VR" else "5"})
              j=json.load(urllib.request.urlopen(r,timeout=20))
              ps=j.get("playabilityStatus",{})
              fm=j.get("streamingData",{}).get("adaptiveFormats",[])
              aud=[f for f in fm if f.get("mimeType","").startswith("audio")]
              print(client, ps.get("status"), ps.get("reason"), "audio",len(aud), "url?", [bool(f.get("url")) for f in aud][:4], "cipher?", [bool(f.get("signatureCipher")) for f in aud][:2])
              if aud and aud[0].get("url"):
                  u=max(aud,key=lambda f:f.get("bitrate",0))["url"]
                  try:
                      rr=urllib.request.Request(u, headers={"Range":"bytes=0-1023","User-Agent":ua})
                      resp=urllib.request.urlopen(rr,timeout=20); print("  fetch",resp.status,len(resp.read()))
                  except Exception as e: print("  fetch ERR",e)
          vr_ua="com.google.android.apps.youtube.vr.oculus/1.62.27 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip"
          for args in [("ANDROID_VR","1.62.27",vr_ua,{"deviceMake":"Oculus","deviceModel":"Quest 3","androidSdkVersion":32,"osName":"Android","osVersion":"12L"}),
                       ("IOS","20.10.4","com.google.ios.youtube/20.10.4 (iPhone16,2; U; CPU iOS 18_3_2 like Mac OS X;)",{"deviceMake":"Apple","deviceModel":"iPhone16,2","osName":"iPhone","osVersion":"18.3.2.22D82"})]:
              try: player(*args)
              except Exception as e: print(args[0],"ERR",e)
          PY
          python3 p.py
