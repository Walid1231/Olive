name: probe livekit
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=2.30.0
          curl -sL -o s.jar https://repo1.maven.org/maven2/io/livekit/livekit-android/$V/livekit-android-$V-sources.jar
          mkdir s && cd s && unzip -q ../s.jar && cd ..
          f=$(grep -rl "class AudioTrackPublishDefaults" s); echo "=== $f"; sed -n '/class AudioTrackPublishDefaults/,/^)/p' $f
          echo "=== LiveKit.create"; sed -n '/fun create(/,/): Room/p' s/io/livekit/android/LiveKit.kt
          echo "=== setAudioBufferCallback"; sed -n '125,160p' s/io/livekit/android/room/track/LocalAudioTrack.kt
          echo "=== RoomEvent classes"; grep -nE "^\s*class |^sealed" s/io/livekit/android/events/RoomEvent.kt | head -40
          echo "=== MediaAudioType"; sed -n '/class MediaAudioType/,/^    }/p' s/io/livekit/android/LiveKitOverrides.kt
          echo "=== audio_processing / record"; grep -rn "AudioRecord\b\|setAudioRecord\|audioRecordEnabled\|setPreferredInputDevice\|createAudioDeviceModule" s | head -15
          echo "=== JavaAudioDeviceModule usage"; grep -rn "JavaAudioDeviceModule.builder\|\.setUse\|\.setAudio" s | head -20
          echo "=== Room.events / state"; grep -n "val events\|var state\|val state\|enum class State" s/io/livekit/android/room/Room.kt | head
          curl -sL -o w.aar https://repo1.maven.org/maven2/io/github/webrtc-sdk/android-prefixed/150.7871.04/android-prefixed-150.7871.04.aar || true
          ls -la w.aar; mkdir w && cd w && unzip -q ../w.aar && unzip -q classes.jar -d cls
          javap -cp cls livekit.org.webrtc.audio.JavaAudioDeviceModule 2>&1 | grep -iE "record|stereo|mute|public" | head -40
          javap -cp cls 'livekit.org.webrtc.audio.JavaAudioDeviceModule$Builder' 2>&1 | head -50
