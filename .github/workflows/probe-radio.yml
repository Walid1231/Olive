name: probe-radio
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: YouTube Music radio + book search
        shell: python
        run: |
          import json, urllib.request
          def post(ep, extra):
              body = {"context": {"client": {"clientName": "WEB_REMIX", "clientVersion": "1.20251110.01.00", "hl": "en", "gl": "US"}}}
              body.update(extra)
              req = urllib.request.Request("https://music.youtube.com/youtubei/v1/%s?prettyPrint=false" % ep, data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0", "Origin": "https://music.youtube.com",
                           "X-YouTube-Client-Name": "67", "X-YouTube-Client-Version": "1.20251110.01.00"})
              return json.load(urllib.request.urlopen(req, timeout=20))
          def find(el, key, out):
              if isinstance(el, dict):
                  for k, v in el.items():
                      if k == key and isinstance(v, dict): out.append(v)
                      find(v, key, out)
              elif isinstance(el, list):
                  for v in el: find(v, key, out)
              return out
          def text(t): return "".join(r.get("text", "") for r in (t or {}).get("runs", [])) or (t or {}).get("simpleText", "")
          for vid in ["kJQP7kiw5Fk", "fJ9rUzIMcZQ"]:
              r = post("next", {"videoId": vid, "playlistId": "RDAMVM" + vid})
              items = find(r, "playlistPanelVideoRenderer", [])
              print(vid, "items:", len(items))
              for it in items[:4]:
                  print("  ", it.get("videoId"), "|", text(it.get("title")), "|", text(it.get("longBylineText")), "|", text(it.get("lengthText")), "| thumbs:", len((it.get("thumbnail") or {}).get("thumbnails", [])))
