name: probe stream
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          curl -s https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/yt_dlp/extractor/youtube/_base.py -o base.py
          curl -s https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/yt_dlp/extractor/youtube/_video.py -o video.py
          python3 - <<'PY'
          import re
          s=open('base.py').read()
          for name in ['visionos','tv_samsung','android_vr','ios','tv']:
              m=re.search(r"\n    '"+name+r"': \{(.*?)\n    \},", s, re.S)
              print('=====',name); print(m.group(1) if m else 'NOT FOUND')
          # PO token policy classes / constants used
          for key in ['WEB_PO_TOKEN_POLICIES','class GvsPoTokenPolicy','class PlayerPoTokenPolicy','def _get_default_ytcfg','_STREAMING_DATA_CLIENT_NAME']:
              i=s.find(key); print('=====',key); print(s[i:i+900] if i>=0 else 'NOT FOUND')
          v=open('video.py').read()
          print('===== visionos mentions in _video.py')
          for m in re.finditer(r'visionos', v):
              print(v[max(0,m.start()-400):m.start()+400].replace('\n','\n  ')); print('-----')
          print('===== sabr / hls notes')
          for kw in ['is_sabr','SABR','hls_manifest','server_abr']:
              print(kw, len(re.findall(kw, v)))
          PY
