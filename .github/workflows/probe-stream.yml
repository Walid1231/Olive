name: probe stream
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          VID = "kPa7bsKwL-c"   # a popular music video
          def call(client, ua, name_id, extra_ctx=None):
              ctx = {"client": {**client, "hl": "en", "gl": "US"}}
              body = {"context": ctx, "videoId": VID, "contentCheckOk": True, "racyCheckOk": True}
              if extra_ctx: body.update(extra_ctx)
              req = urllib.request.Request("https://www.youtube.com/youtubei/v1/player?prettyPrint=false",
                  data=json.dumps(body).encode(), method="POST",
                  headers={"Content-Type": "application/json", "User-Agent": ua,
                           "X-YouTube-Client-Name": str(name_id), "X-YouTube-Client-Version": client["clientVersion"],
                           "Origin": "https://www.youtube.com"})
              t=time.time()
              try:
                  j = json.load(urllib.request.urlopen(req, timeout=15))
              except Exception as e:
                  print("  request error", e); return
              ps = j.get("playabilityStatus", {})
              print(f"  status={ps.get('status')} reason={ps.get('reason')} ({time.time()-t:.2f}s)")
              sd = j.get("streamingData", {})
              af = sd.get("adaptiveFormats", [])
              aud = [f for f in af if f.get("mimeType","").startswith("audio/")]
              print("  adaptive:", len(af), "audio:", len(aud), "hls:", bool(sd.get("hlsManifestUrl")), "sabr:", bool(sd.get("serverAbrStreamingUrl")))
              for f in aud[:4]:
                  has_url = "url" in f; has_cipher = "signatureCipher" in f
                  print(f"   itag={f.get('itag')} {f.get('mimeType','')[:30]} br={f.get('bitrate')} url={has_url} cipher={has_cipher}")
              if aud and "url" in aud[0]:
                  u = aud[0]["url"]
                  import urllib.parse as up
                  q = up.parse_qs(up.urlparse(u).query)
                  print("   c=", q.get("c"), "n=" , bool(q.get("n")), "pot=", bool(q.get("pot")))
                  r = urllib.request.Request(u, headers={"User-Agent": ua, "Range": "bytes=0-2047"})
                  try:
                      resp = urllib.request.urlopen(r, timeout=10); print("   range GET ->", resp.status, resp.headers.get("Content-Type"))
                  except Exception as e:
                      print("   range GET error ->", e)
          print("== VISIONOS")
          call({"clientName":"VISIONOS","clientVersion":"1.02","deviceMake":"Apple","deviceModel":"RealityDevice17,1","osName":"visionOS","osVersion":"26.5.23O471"},
               "Mozilla/5.0 (Macintosh; Intel Mac OS X 15_7_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Safari/605.1.15", 101)
          print("== TV_SAMSUNG")
          call({"clientName":"TVHTML5","clientVersion":"5.20260707","deviceMake":"Samsung","deviceModel":"UKS9800","osName":"Tizen","osVersion":"2.4.0"},
               "Mozilla/5.0 (SMART-TV; Linux; Tizen 2.4.0) AppleWebKit/538.1 (KHTML, like Gecko) Version/2.4.0 TV Safari/538.1", 7)
          print("== ANDROID_VR 1.65.10")
          call({"clientName":"ANDROID_VR","clientVersion":"1.65.10","deviceMake":"Oculus","deviceModel":"Quest 3","androidSdkVersion":32,"osName":"Android","osVersion":"12L"},
               "com.google.android.apps.youtube.vr.oculus/1.65.10 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip", 28)
          print("== ANDROID_VR 1.62.27 (what Olive uses now)")
          call({"clientName":"ANDROID_VR","clientVersion":"1.62.27","deviceMake":"Oculus","deviceModel":"Quest 3","androidSdkVersion":32,"osName":"Android","osVersion":"12L"},
               "com.google.android.apps.youtube.vr.oculus/1.62.27 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip", 28)
          PY
