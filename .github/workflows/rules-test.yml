name: Firestore rules test
on:
  push:
    paths: ["docs/firestore.rules", "docs/rules-test/**", ".github/workflows/rules-test.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: docs/rules-test } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx firebase emulators:exec --only firestore --project demo-olive "node test.mjs"
      - name: Edge function rejects calls without a login
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://wbeiwxkkqmhoyekvfztr.supabase.co/functions/v1/olive-api -H 'content-type: application/json' -d '{"action":"upload"}')
          echo "olive-api without token → $code"; test "$code" = "401"
